<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEL 校長總控台</title>
<style>
:root{--red:#e5484d;--blue:#3b82f6;--yellow:#f5b301;--green:#2fa86b;--none:#cbd5e1;--ink:#1f2937;--mute:#6b7280;--bg:#f4f5fa;--line:#e5e7eb;--pri:#0f766e}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:19px;margin:0;flex:1;min-width:150px}
header input,header button,header a{font-size:15px;padding:8px 10px;border-radius:10px;border:0;font-family:inherit}
header button{background:#fff;color:var(--pri);font-weight:700;cursor:pointer}
header a{color:#fff;padding:8px 0}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.login{max-width:340px;margin:60px auto;background:#fff;padding:24px;border-radius:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.login input{width:100%;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:10px;margin:12px 0}
.login button{width:100%;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px;font-size:17px;font-weight:700;cursor:pointer}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{flex:1;min-width:90px;border-radius:12px;padding:10px;color:#fff;text-align:center;font-weight:700}
.chip b{display:block;font-size:26px}
.chip.red{background:var(--red)}.chip.blue{background:var(--blue)}.chip.yellow{background:var(--yellow);color:#3a2b00}.chip.green{background:var(--green)}.chip.none{background:#94a3b8}.chip.all{background:#374151}
h2{font-size:17px;margin:16px 0 8px}
.alert{background:#fef2f2;border:2px solid var(--red);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.alert div{padding:5px 0;border-bottom:1px solid #fecaca}.alert div:last-child{border:0}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cc{background:#fff;border-radius:14px;padding:12px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.07);border:3px solid transparent}
.cc.open{border-color:var(--pri)}
.cc h3{margin:0 0 6px;display:flex;justify-content:space-between}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--none);margin:6px 0}
.bar i{display:block}
.i-red{background:var(--red)}.i-blue{background:var(--blue)}.i-yellow{background:var(--yellow)}.i-green{background:var(--green)}
.mute{color:var(--mute);font-size:14px}
.chg{font-size:12px;padding:2px 8px;border-radius:8px;color:#fff;font-weight:700}
.chg.improved{background:var(--green)}.chg.worsened{background:var(--red)}.chg.shifted{background:#f59e0b}.chg.same{background:#94a3b8}
.detail{background:#fff;border-radius:14px;padding:12px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;background:var(--none)}
.dot.red{background:var(--red)}.dot.blue{background:var(--blue)}.dot.yellow{background:var(--yellow)}.dot.green{background:var(--green)}
.hide{display:none}
.demo{background:#fff7ed;color:#9a3412;padding:8px 14px;font-size:14px;text-align:center}
.rpt-head h2{margin:4px 0}.rpt-sum ul{margin:0;padding-left:20px;line-height:1.9}.rpt-sum .up{color:#b91c1c}.rpt-sum .down{color:#047857}
@media print{header,.st-tabs,.no-print,#viewTabs,.demo{display:none!important}body{background:#fff}.st-card,.st-sum div{box-shadow:none;border:1px solid #e5e7eb;break-inside:avoid}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <h2>🏫 SEL 校長總控台</h2>
  <div class="mute">請輸入校長密碼</div>
  <input type="password" id="pass" placeholder="校長密碼">
  <label class="mute" style="display:block;margin:6px 0"><input type="checkbox" id="keep"> 在這台裝置記住（只有個人電腦才勾選）</label>
  <button id="loginBtn">進入</button>
  <div id="loginErr" style="color:#b91c1c;margin-top:8px"></div>
</div>

<div id="app" class="hide">
  <div class="demo hide" id="demo">⚠️ 展示模式：只顯示這台裝置上的資料（密碼任意）。</div>
  <header>
    <h1>🏫 全校 SEL 情緒總覽（含姓名）</h1>
    <input type="date" id="date">
    <button id="refresh">🔄 重新整理</button>
    <button id="csvBtn">⬇ 匯出CSV</button>
    <button id="clrAll" style="background:#fee2e2;color:#991b1b">🗑 清除全校當天資料</button>
    <a href="teacher.html">班級看板</a>
  </header>
  <div class="wrap">
    <div class="st-tabs" id="viewTabs"><button data-v="today" class="on">📅 今日總覽</button><button data-v="stats">📈 趨勢統計（短／中／長期）</button><button data-v="report">📄 全校報告（每天／週／月）</button><button data-v="accounts">👩‍🏫 教師帳號</button></div>
    <div id="statsView" class="hide"></div>
    <div id="reportView" class="hide"></div>
    <div id="accountsView" class="hide"></div>
    <div id="todayView">
    <div class="stats" id="stats"></div>
    <div id="wkWarn"></div>
    <div id="alerts"></div>
    <h2>各班概況（點班級看學生姓名與情緒）</h2>
    <div class="classes" id="classes"></div>
    <div id="detail"></div>
    <div class="mute" id="meta" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<script src="mask.js"></script>
<script src="faces.js"></script>
<script src="animals.js"></script>
<script src="stats.js"></script>
<script src="report.js"></script>
<script src="config.js"></script>
<script>
/* ========= 設定 ========= */
const GAS_URL = window.SEL_GAS_URL || 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';   // 網址在 config.js 設定
const GRADE_ZH=['','一','二','三','四','五','六'], REFRESH_MS=60000;
const COLOR={red:'紅·生氣',blue:'藍·沮喪',yellow:'黃·焦慮',green:'綠·平和'};
/* ========================= */
const $=id=>document.getElementById(id), DEMO=GAS_URL.startsWith('YOUR_');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}};
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const clsLabel=c=>(GRADE_ZH[c[0]]||c[0])+'年'+c.slice(1)+'班';
let PASS='',data=null,openCls='',timer=null;

async function getOverview(date){
  if(DEMO){                         // 展示模式：由本機資料組成
    const ch=store.get('sel_demo_checkins',[]).filter(c=>c.date===date), fu=store.get('sel_demo_fu',[]).filter(f=>f.date===date);
    const classes=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k.startsWith('sel_roster_'))continue;
      const cls=k.slice(11), ro=store.get(k,[]);
      classes.push({cls,students:ro.map(r=>{const mine=ch.filter(x=>x.cls===cls&&x.seat===r.seat),f=fu.filter(x=>x.cls===cls&&x.seat===r.seat).pop();
        const pick=p=>{const x=mine.filter(y=>y.kind===p).pop();return x?{color:x.color,emotion:x.emotion,note:x.note,time:x.time}:null};
        const ci=pick('ci'),co=pick('co'),L=co||ci;
        return {seat:r.seat,name:r.name,avatar:r.avatar,...(ci?{ci}:{}),...(co?{co}:{}),...(L?{color:L.color,emotion:L.emotion,note:L.note}:{}),change:(ci&&co)?changeKind(ci.color,co.color):'',...(f?{fu:{status:f.status,note:f.note}}:{})}})});}
    return {ok:true,date,classes:classes.sort((a,b)=>a.cls.localeCompare(b.cls))};
  }
  const r=await fetch(GAS_URL+'?'+new URLSearchParams({action:'overview',date,pass:PASS}));return r.json();
}

$('loginBtn').onclick=login;$('pass').onkeydown=e=>{if(e.key==='Enter')login()};
async function login(){
  PASS=$('pass').value;$('loginErr').textContent='';if(!PASS)return;
  try{const r=await getOverview(todayStr());if(!r.ok)throw 0}catch(e){$('loginErr').textContent='密碼錯誤、非校長密碼或無法連線';return}
  try{sessionStorage.setItem('sel_ppass',PASS);if($('keep').checked)localStorage.setItem('sel_ppass_keep',PASS)}catch(e){}
  start();
}
function start(){
  $('loginView').classList.add('hide');$('app').classList.remove('hide');if(DEMO)$('demo').classList.remove('hide');
  SELStats.bindWarn($('wkWarn'),markHandled);
  $('date').value=todayStr();$('date').onchange=load;$('refresh').onclick=load;$('csvBtn').onclick=exportCsv;$('clrAll').onclick=()=>clearDay('');
  load();clearInterval(timer);timer=setInterval(load,REFRESH_MS);
}
try{const sp=sessionStorage.getItem('sel_ppass')||localStorage.getItem('sel_ppass_keep');if(sp){PASS=sp;getOverview(todayStr()).then(r=>{if(r.ok)start()}).catch(()=>{})}}catch(e){}

/* 外部連結（例如 Ybot 首頁）可直接開到指定畫面：
   principal.html?view=report&mode=week｜?view=report&mode=day｜?view=report&mode=month｜?view=stats&days=180｜?view=today */
const QP=new URLSearchParams(location.search);
let view=['today','stats','report','accounts'].includes(QP.get('view'))?QP.get('view'):'today', sDays=[7,30,180,365].includes(+QP.get('days'))?+QP.get('days'):7, sCls='';
document.querySelectorAll('#viewTabs button').forEach(x=>x.classList.toggle('on',x.dataset.v===view));
$('viewTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;
  document.querySelectorAll('#viewTabs button').forEach(x=>x.classList.toggle('on',x===b));load()};
async function loadStats(){
  if(DEMO){$('statsView').innerHTML='<div class="mute">展示模式不提供統計，部署 Apps Script 後即可使用。</div>';return}
  const opts='<option value="">全校</option>'+((data&&data.classes)||[]).map(c=>`<option value="${c.cls}" ${c.cls===sCls?'selected':''}>${clsLabel(c.cls)}</option>`).join('');
  const bar='<select id="sCls" style="font-size:15px;padding:7px;border-radius:10px;border:2px solid #cbd5e1">'+opts+'</select>'+SELStats.tabs(sDays);
  $('statsView').innerHTML=bar+'<div class="mute">統計中…</div>';
  try{
    const qs={action:'stats',days:sDays,pass:PASS};if(sCls)qs.cls=sCls;
    const d=await (await fetch(GAS_URL+'?'+new URLSearchParams(qs))).json();
    if(!d.ok)throw new Error(d.error);
    $('statsView').innerHTML=bar+SELStats.html(d,{showCls:true});
  }catch(e){$('statsView').innerHTML=bar+'<div class="mute">載入失敗：'+esc(e.message)+'</div>'}
}
$('statsView').onclick=e=>{const b=e.target.closest('.st-tabs button');if(b){sDays=+b.dataset.days;loadStats()}};
$('statsView').onchange=e=>{if(e.target.id==='sCls'){sCls=e.target.value;loadStats()}};
async function load(){
  $('todayView').classList.toggle('hide',view!=='today');$('statsView').classList.toggle('hide',view!=='stats');$('reportView').classList.toggle('hide',view!=='report');$('accountsView').classList.toggle('hide',view!=='accounts');
  try{const r=await getOverview($('date').value);if(!r.ok)throw new Error(r.error);data=r}catch(e){$('meta').textContent='載入失敗：'+e.message;return}
  if(view==='stats'){loadStats();return}
  if(view==='report'){loadReport();return}
  if(view==='accounts'){loadAccounts();return}
  loadWarn();
  render();
}
const CHG_ZH={improved:'好轉',same:'持平',shifted:'轉換',worsened:'轉差'}, CHG_ICON={improved:'↑',same:'＝',shifted:'⇄',worsened:'↓'};
const changeKind=(a,b)=>a===b?'same':b==='green'?'improved':a==='green'?'worsened':'shifted';
const cell=x=>x?`<span class="dot ${x.color}"></span>${x.emotion?SELFaces.html(x.emotion,22):esc(COLOR[x.color])}`:'<span class="mute">—</span>';
const need=s=>s.color&&!s.fu&&(s.color==='red'||(s.color==='blue'&&s.note));
async function markHandled(x){
  try{const r=await (await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'followup',cls:x.cls,seat:x.seat,name:x.name,status:x.status||'已關懷',note:'一週預警處理',teacher:'校長',pass:PASS})})).json();if(!r.ok)throw 0}catch(e){alert('送出失敗，請再試一次')}
  warnAt=0;loadWarn();
}
let warnAt=0;
async function loadWarn(){   // 一週預警橫幅（最多每 5 分鐘重新計算一次，避免每分鐘自動更新時重複運算）
  if(DEMO||Date.now()-warnAt<300000)return;warnAt=Date.now();
  try{const d=await (await fetch(GAS_URL+'?'+new URLSearchParams({action:'stats',days:7,pass:PASS}))).json();if(d.ok)$('wkWarn').innerHTML=SELStats.warnBanner(d,true)}catch(e){warnAt=0}
}
let acctEdit=null, acctData=null, newPw=null;
const postP=async b=>(await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,pass:PASS})})).json();
async function loadAccounts(){
  const V=$('accountsView');
  if(DEMO){V.innerHTML='<div class="mute">展示模式不提供教師帳號管理，部署 Apps Script 後即可使用。</div>';return}
  if(!acctData)V.innerHTML='<div class="mute">載入中…</div>';
  try{const r=await (await fetch(GAS_URL+'?'+new URLSearchParams({action:'listTeachers',pass:PASS}))).json();if(!r.ok)throw new Error(r.error);acctData=r}catch(e){V.innerHTML='<div class="mute">載入失敗：'+esc(e.message)+'（請先更新並重新部署最新的 Code.gs）</div>';return}
  renderAccounts();
}
function renderAccounts(){
  const V=$('accountsView'),d=acctData,e=acctEdit;
  const pwBox=newPw?`<div style="background:#ecfdf5;border:2px solid #10b981;border-radius:12px;padding:12px;margin-bottom:12px"><b>${esc(newPw.who)} 的新密碼：</b> <code style="font-size:20px;background:#fff;padding:2px 8px;border-radius:6px">${esc(newPw.pass)}</code>
    <div class="mute" style="margin-top:6px">這個密碼只會顯示這一次，離開這頁就看不到了。請交給老師，並請老師登入後到「🔑 改密碼」換成自己的。 <button id="pwOk" style="margin-left:8px">我記下了</button></div></div>`:'';
  const form=e?`<div class="detail" style="margin-bottom:12px"><b>${e.acct?'編輯教師':'新增教師'}</b>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><input id="aName" placeholder="教師姓名" value="${esc(e.name)}" style="padding:8px;border:2px solid #cbd5e1;border-radius:10px;font-size:15px"><input id="aMail" placeholder="信箱（收預警信，可留空）" value="${esc(e.email)}" style="padding:8px;border:2px solid #cbd5e1;border-radius:10px;font-size:15px;min-width:230px"></div>
    <div class="mute">負責的班級：</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin:6px 0">${d.classes.map(c=>`<label><input type="checkbox" class="aCls" value="${esc(c)}" ${e.classes.includes(c)?'checked':''}> ${clsLabel(c)}</label>`).join('')}</div>
    <div id="aErr" style="color:#b91c1c;min-height:20px"></div>
    <button id="aSave">${e.acct?'儲存':'建立帳號（會產生隨機密碼）'}</button> <button id="aCancel">取消</button>
    ${e.acct?'<div class="mute" style="margin-top:6px">把所有班級取消勾選再儲存，就是刪除這個帳號。</div>':''}</div>`:'';
  V.innerHTML=pwBox+form+`<div style="margin-bottom:8px"><b>教師帳號（${d.teachers.length}）</b> <button id="aNew">＋ 新增教師</button></div>
    <table><tr><th>教師</th><th>班級</th><th>信箱</th><th></th></tr>`+d.teachers.map(t=>`<tr><td>${esc(t.name||'（未填姓名）')}</td><td>${t.classes.map(clsLabel).join('、')}</td><td>${esc(t.email)||'<span class="mute">未填（收不到預警信）</span>'}</td>
    <td><button data-a="edit" data-k="${t.acct}">編輯</button> <button data-a="reset" data-k="${t.acct}">重設密碼</button></td></tr>`).join('')+`</table>
    <div class="mute" style="margin-top:8px">密碼只存在試算表，這裡永遠看不到現有密碼；老師可以自己在看板按「🔑 改密碼」更改。</div>`;
  $('aNew').onclick=()=>{acctEdit={acct:'',name:'',email:'',classes:[]};newPw=null;renderAccounts()};
  if($('pwOk'))$('pwOk').onclick=()=>{newPw=null;renderAccounts()};
  if($('aCancel'))$('aCancel').onclick=()=>{acctEdit=null;renderAccounts()};
  if($('aSave'))$('aSave').onclick=async()=>{
    const classes=[...document.querySelectorAll('.aCls:checked')].map(x=>x.value),name=$('aName').value.trim(),email=$('aMail').value.trim();
    if(!name){$('aErr').textContent='請填教師姓名';return}
    if(!classes.length&&!e.acct){$('aErr').textContent='請至少勾選一個班級';return}
    if(!classes.length&&!confirm('沒有勾選任何班級，儲存＝刪除「'+e.name+'」這個帳號，確定嗎？'))return;
    $('aSave').disabled=true;
    try{const r=await postP({action:'saveTeacher',acct:e.acct,name,email,classes});if(!r.ok)throw new Error(r.error);
      newPw=r.password?{who:name,pass:r.password}:null;acctEdit=null;acctData=null;loadAccounts();
    }catch(x){$('aErr').textContent=x.message==='bad email'?'信箱格式不正確':x.message==='bad class'?'有不存在的班級':'儲存失敗：'+x.message;$('aSave').disabled=false}
  };
  V.onclick=async ev=>{const b=ev.target.closest('button[data-a]');if(!b)return;const t=d.teachers.find(x=>x.acct===b.dataset.k);if(!t)return;
    if(b.dataset.a==='edit'){acctEdit={acct:t.acct,name:t.name,email:t.email,classes:[...t.classes]};newPw=null;renderAccounts();return}
    if(!confirm('重設「'+(t.name||'這位老師')+'」的密碼？舊密碼會立刻失效。'))return;
    try{const r=await postP({action:'resetPassword',acct:t.acct});if(!r.ok)throw new Error(r.error);newPw={who:t.name||'這位老師',pass:r.password};acctData=null;loadAccounts()}catch(x){alert('重設失敗：'+x.message)}
  };
}
let rMode=['day','week','month'].includes(QP.get('mode'))?QP.get('mode'):'week';
async function loadReport(){
  const bar='<div class="no-print" style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">'+SELReport.tabs(rMode)+'<button id="rptPrint" style="margin:6px 0 12px;padding:7px 14px;border-radius:999px;border:2px solid #374151;background:#fff;font-size:15px;cursor:pointer">🖨 列印／存成 PDF</button></div>';
  if(DEMO){$('reportView').innerHTML=bar+'<div class="mute">展示模式不提供報告，部署 Apps Script 後即可使用。</div>';return}
  $('reportView').innerHTML=bar+'<div class="mute">報告產生中…</div>';
  try{
    const m=SELReport.MODES.find(x=>x.id===rMode);
    const d=await (await fetch(GAS_URL+'?'+new URLSearchParams({action:'stats',days:m.days,pass:PASS}))).json();
    if(!d.ok)throw new Error(d.error);
    $('reportView').innerHTML=bar+SELReport.html(d,rMode);
  }catch(e){$('reportView').innerHTML=bar+'<div class="mute">載入失敗：'+esc(e.message)+'</div>'}
}
$('reportView').onclick=e=>{const b=e.target.closest('#rptTabs button');if(b){rMode=b.dataset.m;loadReport();return}if(e.target.id==='rptPrint')window.print()};
function render(){
  const cnt={red:0,blue:0,yellow:0,green:0,none:0};let total=0;
  data.classes.forEach(c=>c.students.forEach(s=>{total++;cnt[s.color||'none']++}));
  $('stats').innerHTML=`<div class="chip all"><b>${total}</b>全校人數</div><div class="chip red"><b>${cnt.red}</b>🔴 生氣</div><div class="chip blue"><b>${cnt.blue}</b>🔵 沮喪</div><div class="chip yellow"><b>${cnt.yellow}</b>🟡 焦慮</div><div class="chip green"><b>${cnt.green}</b>🟢 平和</div><div class="chip none"><b>${cnt.none}</b>⚪ 未簽到</div>`;
  const urgent=[];data.classes.forEach(c=>c.students.forEach(s=>{if(need(s))urgent.push({cls:c.cls,...s})}));
  $('alerts').innerHTML=urgent.length?`<div class="alert"><b>🚨 優先關心（尚未處遇）：${urgent.length} 位</b>`+urgent.map(s=>`<div>${clsLabel(s.cls)} ${s.seat}號 <b>${esc(SELMask(s.name))}</b>　<span class="dot ${s.color}"></span>${s.emotion?SELFaces.html(s.emotion,22):esc(COLOR[s.color])}${s.note?'　💬 '+esc(s.note):''}</div>`).join('')+'</div>':'';
  $('classes').innerHTML=data.classes.map(c=>{
    const n=c.students.length,k={red:0,blue:0,yellow:0,green:0};let done=0;
    c.students.forEach(s=>{if(s.color){k[s.color]++;done++}});
    return `<div class="cc ${openCls===c.cls?'open':''}" data-c="${c.cls}"><h3><span>${clsLabel(c.cls)}</span><span class="mute">${done}/${n} 已簽到</span></h3>
      <div class="bar">${['red','blue','yellow','green'].map(x=>k[x]?`<i class="i-${x}" style="width:${k[x]/n*100}%"></i>`:'').join('')}</div>
      <div class="mute">🔴${k.red} 🔵${k.blue} 🟡${k.yellow} 🟢${k.green}</div>
      <div class="mute">👋${c.students.filter(s=>s.ci).length} 🏁${c.students.filter(s=>s.co).length}　好轉↑${c.students.filter(s=>s.change==='improved').length} 轉差↓${c.students.filter(s=>s.change==='worsened').length}</div></div>`}).join('')||'<div class="mute">尚無名單，請先匯入 Roster。</div>';
  $('classes').onclick=e=>{const c=e.target.closest('.cc');if(c){openCls=openCls===c.dataset.c?'':c.dataset.c;render()}};
  const oc=data.classes.find(c=>c.cls===openCls);
  $('detail').innerHTML=oc?`<div class="detail"><b>${clsLabel(oc.cls)}（${esc($('date').value)}）</b> <button id="clrCls" style="margin-left:10px;background:#fee2e2;color:#991b1b">🗑 清除此班當天資料</button><table><tr><th>座號</th><th>姓名</th><th>👋 Check-in</th><th>🏁 Check-out</th><th>變化</th><th>留言</th><th>處遇</th></tr>`+
    oc.students.map(s=>`<tr><td>${SELAnimals.html(s.avatar,36)} ${s.seat} <a href="referral.html?cls=${encodeURIComponent(oc.cls)}&seat=${s.seat}" target="_blank" title="輔導轉介摘要" style="text-decoration:none">📋</a></td><td>${esc(SELMask(s.name))}</td><td>${cell(s.ci)}</td><td>${cell(s.co)}</td><td>${s.change?`<span class="chg ${s.change}">${CHG_ZH[s.change]}${CHG_ICON[s.change]}</span>`:''}</td><td>${esc(s.note||'')}</td><td>${s.fu?esc(s.fu.status)+(s.fu.note?'：'+esc(s.fu.note):''):''}</td></tr>`).join('')+'</table></div>':'';
  if($('clrCls'))$('clrCls').onclick=()=>clearDay(openCls);
  $('meta').textContent=`${$('date').value} · 更新 ${new Date().toTimeString().slice(0,5)} · 每分鐘自動更新`;
}
async function clearDay(cls){
  const date=$('date').value, what=cls?clsLabel(cls):'全校所有班級';
  if(!confirm(`確定要清除「${what}」${date} 的簽到紀錄嗎？\n清除後學生可以重新 Check-in。`))return;
  if(!cls&&!confirm(`再確認一次：這會清掉全校 ${date} 的所有簽到紀錄。`))return;
  try{
    let r;
    if(DEMO){
      const ck=store.get('sel_demo_checkins',[]),keep=ck.filter(c=>!(c.date===date&&(!cls||c.cls===cls)));
      localStorage.setItem('sel_demo_checkins',JSON.stringify(keep));r={ok:true,deleted:ck.length-keep.length};
    }else{
      r=await (await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'clearDay',pass:PASS,date,cls})})).json();
    }
    if(!r.ok)throw new Error(r.error);
    alert(`已清除 ${r.deleted} 筆（已備份在試算表的 Deleted 分頁）`);
  }catch(e){alert('清除失敗：'+e.message)}
  load();
}
function exportCsv(){
  const rows=[['班級','日期','座號','姓名','Check-in 顏色','Check-in 情緒','Check-out 顏色','Check-out 情緒','當天變化','備註（最新）','處遇狀態']];
  data.classes.forEach(c=>c.students.forEach(s=>rows.push([clsLabel(c.cls),data.date,s.seat,SELMask(s.name),s.ci?COLOR[s.ci.color]:'未簽到',s.ci?s.ci.emotion||'':'',s.co?COLOR[s.co.color]:'未簽到',s.co?s.co.emotion||'':'',s.change?CHG_ZH[s.change]:'',s.note||'',s.fu?s.fu.status:''])));
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`SEL_全校_${data.date}.csv`;a.click();
}
</script>
